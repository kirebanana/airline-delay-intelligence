name: Protected code delivery

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Retained sha256 digest to requalify; blank builds trusted source"
        type: string
        default: ""
      apply:
        description: "Apply the reviewed application-only plan (never starts data)"
        type: boolean
        default: false
      recover_partial_apply:
        description: "Explicit attended review of retained deposed Terraform task bindings"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: application-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'kirebanana/airline-delay-intelligence' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: "true"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
      INPUT_APPLY: ${{ inputs.apply }}
      INPUT_RECOVER_PARTIAL: ${{ inputs.recover_partial_apply }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.14"
          enable-cache: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.4"
          terraform_wrapper: false
      - run: uv sync --locked --all-extras
      - name: Qualify wrong audience and assume exact environment identity
        run: uv run --locked python infra/jobs/deliver.py login
      - name: Test, scan and review immutable code promotion
        run: |
          mkdir -p /tmp/opencode
          args=()
          if [ "$INPUT_APPLY" = "true" ]; then args+=(--apply); fi
          if [ "$INPUT_RECOVER_PARTIAL" = "true" ]; then args+=(--recover-partial); fi
          uv run --locked python infra/jobs/deliver.py deliver --image-digest "$INPUT_IMAGE_DIGEST" "${args[@]}"
