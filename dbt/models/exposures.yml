version: 2
exposures:
  - name: local_airline_delay_dashboard
    type: dashboard
    maturity: low
    description: >
      Local Streamlit: carrier reliability, scheduled-time patterns, origin/ordered
      routes, reported categories and schedule-relative recovery. The Python reader
      filters released flight-grain inputs before final counts and exact quantiles.
      Publication is a separate frozen validation/clone operation, not a dbt model.
    depends_on:
      - ref('fact_flights')
      - ref('dim_date')
      - ref('dim_airport')
      - ref('dim_carrier')
    owner:
      name: Project owner
  - name: den_january_weather_drilldown
    config:
      enabled: "{{ var('weather_enabled', false) }}"
    type: dashboard
    description: Fixed DEN/local-January separate-variable context with all-row coverage and date support.
    depends_on:
      - ref('den_weather')
    owner:
      name: Project owner
