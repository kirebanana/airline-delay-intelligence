[project]
name = "airline-delay-intelligence"
version = "0.1.0"
description = "Reproducible BTS preparation and bounded Snowflake raw ingestion"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
load = ["snowflake-connector-python==4.8.1"]
analytics = [
    "dbt-core==1.12.6",
    "dbt-snowflake==1.12.4",
    "snowflake-connector-python==4.8.1",
    "streamlit==1.66.1",
]

[project.scripts]
airline = "airline_warehouse.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airline_warehouse"]

[dependency-groups]
dev = ["ruff==0.14.2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
